<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Popipants</title>
  <script>if(/github\.io$/.test(location.hostname))document.write('<base href="/popipants-preview/">');</script>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/pixel-fx.css">
  <style>
    .nf{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px 56px;color:#FF5FA2}
    .nf-win{max-width:440px;width:100%}
    .nf-perch{position:relative;width:176px;height:150px;margin:18px auto 8px}
    .nf-perch .px-cat{position:absolute;left:50%;bottom:0;margin-left:-88px;width:176px;height:144px;transform-origin:50% 100%;animation:pxSway 1.35s ease-in-out infinite}
    .nf-perch .px-cat canvas{width:176px}
    .nf-perch .px-cat .px-head{height:88px}
    .nf-perch .px-cat .px-body,.nf-perch .px-cat .px-tail{top:88px;height:56px}
    .nf-code{font:400 64px/1 'Archivo Black',sans-serif;letter-spacing:-.04em;color:#FF5FA2;margin:6px 0}
    .nf p{font:15px/1.6 Inconsolata,monospace;color:#FF5FA2;margin:6px 0 18px}
    .nf-box{border:1.5px dashed #FF5FA2;border-radius:12px;padding:14px;background:#fff}
    @media (prefers-reduced-motion:reduce){.nf-perch .px-cat{animation:none}}
  </style>
</head>
<body class="secondary-page">
  <div class="page-wrapper">
    <div class="page-layout">
      <script src="js/layout.js" data-part="sidebar"></script>
      <main class="main-content" id="main">
        <script src="js/layout.js" data-part="topnav"></script>
        <section class="content-section pg-sec nf">
          <div class="combo-win nf-win"><div class="combo-tb"><i></i><i></i><i></i><span>404.exe</span></div><div class="combo-wb">
            <div class="nf-box">
              <div class="nf-perch" id="nf-cat"></div>
              <div class="nf-code">404</div>
              <p>oops, this page wandered off.<br>the kitty looked everywhere but couldn't find it.</p>
              <a class="btn btn-primary" href="index.html">back home ♡</a>
            </div>
          </div></div>
        </section>
        <script src="js/layout.js" data-part="footer" data-footer="social"></script>
      </main>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/pixel-fx.js"></script>
  <script src="js/combo.js"></script>
  <script>(function(){var c=window.popipantsMakeCat&&window.popipantsMakeCat();if(c)document.getElementById('nf-cat').appendChild(c);})();</script>
</body>
</html>
